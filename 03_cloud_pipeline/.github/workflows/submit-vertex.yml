name: Submit Vertex Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - "base_pipeline.py"
      - "module.py"
      - "pipeline_run.py"
      - "setup_logging.py"
      - ".github/workflows/submit-vertex.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  submit:
    environment: vertex-prod   # set Required reviewers in GitHub → Settings → Environments
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # TFX 1.15 supports py3.9–3.10

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          # TODO: add WIF_PROVIDER and GCP_SA_EMAIL as repository secrets (Settings > Secrets and variables > Actions).
          #       Never paste these values directly into this file.
          create_credentials_file: true
      

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: your-gcp-project-id   # TODO: replace with your Google Cloud project ID
  

      - name: Install SDK deps (compile + submit)
        run: |
          python -m pip install --upgrade pip
          pip install \
            tfx==1.15.1 \
            tensorflow==2.15.1 \
            tensorflow-model-analysis==0.46.0 \
            keras-tuner[bayesian]==1.4.7 \
            tensorflow-transform==1.15.0 \
            absl-py==1.4.0 \
            kfp-pipeline-spec==0.1.16 \
            tensorflow-io-gcs-filesystem==0.37.1 \
            google-cloud-aiplatform==1.74.0 \
            google-cloud-storage==2.19.0

      - name: Compile & submit Vertex Pipeline
        env:
          # Optional envs your script can read; defaults in your code are fine
          # PIPELINE_ROOT: gs://your-bucket-name/pipeline_root   # TODO: your bucket
          # LOCAL_PIPELINE_ROOT: /tmp/pipeline-root
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          CLOUDSDK_CORE_PROJECT: your-gcp-project-id   # TODO: replace with your Google Cloud project ID
          WAIT_FOR_COMPLETION: "1"
          # RUNTIME_SA: ${{ steps.proj.outputs.PROJECT_NUMBER }}-compute@developer.gserviceaccount.com
        run: python3 pipeline_run.py
